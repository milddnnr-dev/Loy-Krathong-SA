<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ลอยกระทงออนไลน์✨</title>
  
  <!-- Google Fonts: Prompt & Mali -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
  
  <style>
    body {
      font-family: 'Prompt', sans-serif;
      user-select: none;
      overflow-x: hidden;
    }
    .font-cute {
      font-family: 'Mali', cursive;
    }
    
    /* Candle flicker animation */
    @keyframes flicker {
      0%, 100% { transform: scale(1) translateY(0); opacity: 0.95; filter: drop-shadow(0 0 8px #ffb703) drop-shadow(0 0 16px #fb8500); }
      25% { transform: scale(1.1, 0.95) translateY(-1px); opacity: 0.85; }
      50% { transform: scale(0.92, 1.1) translateY(1px); opacity: 1; filter: drop-shadow(0 0 12px #ffd166) drop-shadow(0 0 20px #f77f00); }
      75% { transform: scale(1.05, 0.98) translateY(-0.5px); opacity: 0.9; }
    }
    .candle-flame {
      animation: flicker 1.2s infinite ease-in-out;
      transform-origin: bottom center;
    }
    
    /* Floating Lantern in Sky */
    @keyframes skyLantern {
      0% { transform: translate(0, 0) scale(0.8); opacity: 0.2; }
      15% { opacity: 0.85; }
      85% { opacity: 0.8; }
      100% { transform: translate(60px, -650px) scale(0.4); opacity: 0; }
    }
    .lantern {
      position: absolute;
      animation: skyLantern 22s infinite linear;
      pointer-events: none;
    }
    
    /* Water ripple effects */
    @keyframes waveFlow {
      0% { transform: translateX(0); }
      50% { transform: translateX(-25px); }
      100% { transform: translateX(0); }
    }
    .wave-bg {
      animation: waveFlow 7s ease-in-out infinite;
    }

    /* Krathong bobbing on water */
    @keyframes bobbing {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      35% { transform: translateY(-6px) rotate(1.2deg); }
      70% { transform: translateY(4px) rotate(-1.5deg); }
    }
    .krathong-bob {
      animation: bobbing 4.5s ease-in-out infinite;
    }

    /* Custom Glassmorphism */
    .glass-card {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 215, 0, 0.2);
    }
    .glass-modal {
      background: rgba(13, 20, 39, 0.92);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(251, 191, 36, 0.3);
    }

    /* Custom Scrollbar for list */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.6);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(251, 191, 36, 0.4);
      border-radius: 999px;
    }
  </style>
</head>
<body class="bg-[#070b19] text-white min-h-screen relative overflow-hidden flex flex-col justify-between">

  <!-- ==================== NIGHT SKY BACKGROUND ==================== -->
  <div class="absolute inset-0 pointer-events-none z-0 overflow-hidden">
    <!-- Star Canvas -->
    <canvas id="starsCanvas" class="w-full h-full absolute inset-0"></canvas>

    <!-- Full Moon with Halo -->
    <div class="absolute top-6 right-8 md:top-10 md:right-24 flex items-center justify-center">
      <div class="w-28 h-28 md:w-36 md:h-36 rounded-full bg-gradient-to-tr from-amber-200 via-amber-100 to-yellow-50 shadow-[0_0_80px_25px_rgba(255,235,160,0.45)]
